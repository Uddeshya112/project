name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run lint
      - name: Unit and API tests
        run: npm test
      - name: Solver tests
        run: npm run test:solver
      - name: Start security test server
        run: |
          NODE_ENV=test ALLOW_TEST_RESET_TOKEN=true PORT=3000 BASE_URL=http://127.0.0.1:3000 SEED_USER_PASSWORD='CI-Test-Seed-Password-2026!' DEMO_ACCOUNT_PASSWORD='CI-Test-Demo-Password-2026!' nohup npx tsx server.ts >/tmp/intellischedule-test-server.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/api/health/live >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/intellischedule-test-server.log
          exit 1
      - name: Security tests
        env:
          SEED_USER_PASSWORD: CI-Test-Seed-Password-2026!
          DEMO_ACCOUNT_PASSWORD: CI-Test-Demo-Password-2026!
        run: npm run test:security
      - name: Production build
        run: npm run build
